<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하안중 크리스마스 트리 대작전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap" rel="stylesheet">
<!-- Google Firebase (Firestore) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --away-bg:#fbe0dc; --bg:#d9e2f0; --panel:#fffaf0; --panel-2:#f1e6d2; --ink:#2a1d14; --ink-soft:#6e5a47; --line:#2a1d14; --shadow:#2a1d14;
  --red:#c8372d; --red-d:#8e211a; --green:#2f8f4e; --green-d:#1d5e33; --gold:#f2b632; --gold-d:#b8801a; --blue:#3b6fd1; --brown:#8a5a2b;
  --on-accent:#ffffff; --night:#121b3d; --night-2:#1d2a5a; --snow:#ffffff; --snow-ink:#fff8e6; --glow:#fff1a8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --away-bg:#4a1f24; --bg:#0b1120; --panel:#18213a; --panel-2:#232f50; --ink:#f4ead8; --ink-soft:#b8ab94; --line:#04070e; --shadow:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --away-bg:#4a1f24; --bg:#0b1120; --panel:#18213a; --panel-2:#232f50; --ink:#f4ead8; --ink-soft:#b8ab94; --line:#04070e; --shadow:#000000;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:19px;line-height:1.45;-webkit-font-smoothing:antialiased}
.pix{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,canvas:focus-visible,[tabindex]:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}

.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.active{display:flex}
.scene{position:relative;overflow:hidden;background:var(--night);color:var(--snow-ink);
  background-image:repeating-linear-gradient(0deg,var(--night) 0 8px,var(--night-2) 8px 9px)}
.snowfx{position:absolute;inset:0;pointer-events:none}
.snowfx i{position:absolute;top:-8px;width:4px;height:4px;background:var(--snow);opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}

.btn{border:4px solid var(--line);background:var(--red);color:var(--on-accent);font-size:22px;padding:10px 20px;
  box-shadow:4px 4px 0 var(--shadow);transition:transform .06s}
.btn:hover{background:var(--red-d)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
.btn.green{background:var(--green)}.btn.green:hover{background:var(--green-d)}
.btn.ghost{background:var(--panel-2);color:var(--ink)}
.btn.big{font-size:26px;padding:14px 30px}

/* title */
#title{align-items:center;justify-content:center;text-align:center;padding:24px}
.title-card{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:620px}
.eyebrow{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--gold);margin:0;letter-spacing:1px}
.school{margin:0;font-size:22px;color:var(--snow-ink);border:3px solid var(--snow-ink);padding:2px 14px}
h1{margin:0;font-size:clamp(40px,9vw,66px);line-height:1.05;font-weight:400;color:var(--snow-ink);
  text-shadow:4px 4px 0 var(--red-d),8px 8px 0 var(--line)}
.sub{margin:0;color:var(--snow-ink);opacity:.9;font-size:20px}
.duo{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,3vw,28px)}
.santa-big{width:clamp(120px,30vw,180px);height:auto}
.rudy-big{width:clamp(108px,27vw,160px);height:auto}
.bob{animation:bob 1s steps(2) infinite}
.bob2{animation:bob 1s steps(2) infinite .5s}
@keyframes bob{50%{transform:translateY(-6px)}}

/* story */
#story{flex-direction:column;align-items:center;justify-content:flex-end;padding:24px 16px 32px}
.story-stage{position:relative;z-index:1;flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:16px}
.story-stage img{transition:filter .2s, transform .2s}
.story-stage img.dim{filter:brightness(.45) saturate(.6);transform:scale(.92)}
.dialog{position:relative;z-index:1;width:min(720px,100%);background:var(--panel);color:var(--ink);border:4px solid var(--line);
  box-shadow:6px 6px 0 var(--shadow);padding:18px 22px 26px;min-height:150px;cursor:pointer}
.who{position:absolute;top:-20px;left:16px;background:var(--red);color:var(--on-accent);border:4px solid var(--line);padding:0 12px;font-size:20px}
.who.rudy{background:var(--brown)}
.dialog p{margin:6px 0 0;font-size:23px}
.dialog .next{position:absolute;right:16px;bottom:6px;color:var(--red);animation:bob .6s steps(2) infinite}
.skip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:2;background:transparent;border:3px solid var(--snow-ink);color:var(--snow-ink);font-size:17px;padding:4px 12px}

/* game */
#game{flex-direction:column;padding:14px;gap:14px;max-width:1100px;margin:0 auto}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--panel);border:4px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:8px 14px}
.hud .name{font-size:24px;margin-right:auto}
.stat{display:flex;align-items:center;gap:6px;font-size:18px;color:var(--ink-soft)}
.stat b{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--ink);font-weight:400}
.meter{width:110px;height:14px;border:3px solid var(--line);background:var(--panel-2)}
.meter i{display:block;height:100%;background:var(--green);width:0;transition:width .3s steps(6)}
.icon-btn{background:var(--panel-2);border:3px solid var(--line);color:var(--ink);font-size:16px;padding:2px 10px}

.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.tree-col{display:flex;flex-direction:column;gap:12px}
.tree-frame{border:4px solid var(--line);box-shadow:6px 6px 0 var(--shadow);background:var(--night);line-height:0}
#tree{width:100%;aspect-ratio:120/150;display:block;touch-action:manipulation}
#tree.placing{cursor:crosshair}
.inv-wrap{background:var(--panel);border:4px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:10px 12px}
.inv-title{font-size:18px;color:var(--ink-soft);margin:0 0 6px}
#inv{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;align-items:center}
#inv .empty{color:var(--ink-soft);font-size:17px}
.inv-item{position:relative;width:66px;height:66px;border:3px solid var(--line);background:var(--panel-2);display:grid;place-items:center;padding:0}
.inv-item img{width:48px;height:48px;object-fit:contain}
.inv-item.sel{background:var(--gold);transform:translateY(-4px);box-shadow:0 4px 0 var(--shadow)}
.inv-item.legend{animation:invglow 1.2s steps(3) infinite}
.inv-item.legend img{filter:drop-shadow(0 0 4px var(--glow))}
.inv-item.legend::after{content:"✦";position:absolute;top:-10px;right:-8px;color:var(--gold);font-size:18px;text-shadow:0 0 6px var(--glow)}
@keyframes invglow{50%{box-shadow:0 0 0 3px var(--gold),0 0 16px 4px var(--glow)}}

.side{display:flex;flex-direction:column;gap:14px}
.santa-row{display:flex;align-items:flex-end;gap:8px}
.santa-row img.s{width:80px;flex:none}
.santa-row img.r{width:66px;flex:none}
.bubble{position:relative;flex:1;background:var(--panel);border:4px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:14px 14px 10px;font-size:20px;min-height:72px;margin-top:14px}
.bubble .who{top:-16px;left:10px;font-size:16px;padding:0 8px;border-width:3px}
.jump{animation:jump .5s steps(4)}
@keyframes jump{40%{transform:translateY(-18px)}}
.shake{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.card{background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 var(--shadow);padding:18px}
.ph{margin:0 0 14px;font-size:26px;font-weight:400}
.boxes{display:grid;gap:12px}
.boxbtn{display:grid;grid-template-columns:64px 1fr auto;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;
  background:var(--panel-2);color:var(--ink);border:4px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:10px 14px}
.boxbtn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.boxbtn:disabled{opacity:.45;cursor:not-allowed}
.boxbtn .gicon{grid-row:1/3;width:56px;height:56px}
.boxbtn .bl{font-size:24px}
.boxbtn .stars{color:var(--gold-d);font-size:20px;letter-spacing:2px}
.boxbtn .left{font-size:16px;color:var(--ink-soft)}
.boxbtn .prev{display:flex;gap:4px;justify-content:flex-end}
.boxbtn.lv3 .gicon{animation:invglow 1.4s steps(3) infinite}
.mini{width:22px;height:22px;object-fit:contain}

.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.badge{border:3px solid var(--line);padding:0 10px;font-size:18px;color:var(--on-accent)}
.badge.lv1{background:var(--green)}.badge.lv2{background:var(--blue)}.badge.lv3{background:var(--red)}
.src{font-size:15px;color:var(--ink-soft);margin-left:8px}
.link{background:none;border:none;color:var(--ink-soft);font-size:17px;text-decoration:underline;padding:4px}
.qtext{font-size:22px;margin:6px 0 16px;line-height:1.55}
.qtext .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-size:.9em;line-height:1.3}
.qtext .frac span+span{border-top:2px solid var(--ink);padding-top:2px}
.qtable{border-collapse:collapse;margin:10px 0;font-size:19px}
.qtable th,.qtable td{border:2px solid var(--line);padding:3px 12px;text-align:center}
.qtable th{background:var(--panel-2);font-weight:400}
.bogi{border:3px solid var(--line);padding:8px 12px;margin-top:10px;font-size:19px;line-height:1.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.long{grid-template-columns:1fr}
.choice{display:flex;align-items:center;gap:10px;background:var(--panel-2);color:var(--ink);border:4px solid var(--line);
  box-shadow:3px 3px 0 var(--shadow);font-size:21px;padding:9px 12px;text-align:left}
.choices.long .choice{font-size:18px}
.choice:hover{background:var(--gold)}
.choice .num{flex:none;font-family:'Press Start 2P',monospace;font-size:11px;background:var(--line);color:var(--panel);padding:4px 6px}
.ans{display:flex;gap:10px}
.ans input{flex:1;min-width:0;font-family:inherit;font-size:24px;padding:8px 12px;border:4px solid var(--line);background:var(--panel-2);color:var(--ink)}
.ans-note{font-size:16px;color:var(--ink-soft);margin:8px 0 0}

.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.result h3{margin:0;font-size:34px;font-weight:400}
.result.ok h3{color:var(--green)}.result.no h3{color:var(--red)}
.result.legend h3{color:var(--gold-d);text-shadow:0 0 12px var(--glow)}
.reward-stage{position:relative;width:150px;height:150px;display:grid;place-items:center}
.reward-img{position:relative;z-index:1;width:104px;height:104px;object-fit:contain;animation:pop .5s steps(5)}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}}
.reward-stage.legend{width:200px;height:200px}
.reward-stage .rays{position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,var(--gold) 0 9deg,transparent 9deg 30deg);opacity:.7;animation:spin 5s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%)}
.reward-stage.legend .reward-img{width:120px;height:120px;filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 14px var(--gold));
  animation:pop .5s steps(5),glowp 1.2s steps(3) infinite .5s}
@keyframes glowp{50%{filter:drop-shadow(0 0 10px var(--snow)) drop-shadow(0 0 26px var(--gold))}}
@keyframes spin{to{transform:rotate(360deg)}}
.burst i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;background:var(--gold);z-index:2;
  transform:rotate(var(--a)) translateX(0);animation:burst 1s steps(8) forwards}
.burst i:nth-child(2n){background:var(--snow);width:6px;height:6px}
@keyframes burst{to{transform:rotate(var(--a)) translateX(var(--d));opacity:0}}
.rarity{margin:0;font-size:18px;color:var(--gold-d)}
.reward-name{font-size:24px}
.hint{background:var(--panel-2);border:3px dashed var(--line);padding:10px 14px;font-size:19px;text-align:left;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

#flash{position:fixed;inset:0;z-index:30;pointer-events:none;background:var(--glow);opacity:0}
#flash.on{animation:flash .7s steps(5)}
@keyframes flash{20%{opacity:.75}100%{opacity:0}}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(5,8,20,.75)}
.overlay.hidden{display:none}
.modal{background:var(--panel);color:var(--ink);border:4px solid var(--line);box-shadow:8px 8px 0 var(--shadow);padding:22px;max-width:480px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.modal h2{margin:0;font-size:38px;font-weight:400;color:var(--red)}
.modal .final{width:200px;border:4px solid var(--line)}
.modal .duo img{width:70px}

/* login */
.login{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(440px,100%);text-align:left}
.login label{display:flex;flex-direction:column;gap:4px;font-size:18px;color:var(--snow-ink)}
.login input,.pw-in,.dash-tools input{font-family:inherit;font-size:22px;padding:8px 10px;border:4px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
.login .btn{grid-column:1/-1}
.login-err{grid-column:1/-1;margin:0;min-height:1.3em;color:var(--gold);font-size:17px}
.login-note{grid-column:1/-1;margin:0;font-size:15px;color:var(--snow-ink);opacity:.8}
.login-note.warn{color:var(--gold);opacity:1}
.teacher-link{background:none;border:none;color:var(--snow-ink);opacity:.7;text-decoration:underline;font-size:16px;margin-top:4px}
.stat.me{color:var(--ink);font-size:20px}
.stat.me b{font-family:'Press Start 2P',monospace;font-size:12px;font-weight:400}
#modeTxt{color:var(--red)}
.pw-in{width:100%;text-align:center}

/* dashboard */
#dash{flex-direction:column;gap:14px;padding:16px;max-width:1320px;margin:0 auto;width:100%}
.dash-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:4px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:12px 16px}
.dash-head h2{margin:0;font-size:30px;font-weight:400}
.dash-sub{margin:0;color:var(--ink-soft);font-size:17px;display:flex;align-items:center;gap:8px}
.live{width:12px;height:12px;background:var(--ink-soft);display:inline-block}
.live.ok{background:var(--green);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.dash-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.sm{font-size:17px;padding:6px 12px;border-width:3px;box-shadow:3px 3px 0 var(--shadow)}
.chk{font-size:17px;display:flex;gap:6px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--panel);color:var(--ink);border:4px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:10px 12px;text-align:left;display:flex;align-items:baseline;gap:10px}
.kpi b{font-family:'Press Start 2P',monospace;font-size:20px;font-weight:400}
.kpi span{font-size:18px;color:var(--ink-soft)}
.kpi.sel{background:var(--gold)}
.kpi.sel span{color:var(--ink)}
.kpi.k-away b{color:var(--red)}
.dash-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dash-tools input{font-size:19px;padding:6px 10px;width:min(320px,100%)}
.dash-tools span{color:var(--ink-soft);font-size:17px}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:4px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
.dtable{border-collapse:collapse;width:100%;min-width:980px;font-size:17px}
.dtable th{background:var(--panel-2);font-weight:400;text-align:left;padding:8px 10px;border-bottom:3px solid var(--line);white-space:nowrap}
.dtable td{padding:7px 10px;border-bottom:2px solid var(--panel-2);white-space:nowrap}
.dtable tr.away td{background:var(--away-bg)}
.dtable tr.off td{color:var(--ink-soft)}
.empty-row{text-align:center;color:var(--ink-soft);padding:24px!important}
.chip{display:inline-block;border:2px solid var(--line);padding:0 8px;font-size:15px}
.chip.on{background:var(--green);color:var(--on-accent)}
.chip.away{background:var(--red);color:var(--on-accent);animation:blink 1s steps(2) infinite}
.chip.done{background:var(--gold);color:var(--line)}
.chip.off{background:var(--panel-2);color:var(--ink-soft)}
.lvc{display:inline-flex;align-items:center;gap:6px}
.lvc i{display:inline-block;width:44px;height:10px;border:2px solid var(--line);background:var(--panel-2)}
.lvc i span{display:block;height:100%;background:var(--green)}
.dash-h3{margin:6px 0 0;font-size:24px;font-weight:400}
.qstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.qs{background:var(--panel);border:3px solid var(--line);padding:8px 10px;font-size:16px}
.qs .badge{font-size:14px;padding:0 6px;border-width:2px}
.qs .bar{height:12px;border:2px solid var(--line);background:var(--panel-2);margin:6px 0 2px}
.qs .bar span{display:block;height:100%;background:var(--green)}
.qs-n{color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--red);color:var(--on-accent);border:4px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:8px 16px;font-size:19px;display:none;max-width:90vw}
.toast.show{display:block}

@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .login{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .side{order:-1}
  .choices{grid-template-columns:1fr}
  .tree-frame{max-width:420px;margin:0 auto;width:100%}
  .hud .name{font-size:20px;width:100%}
  .santa-row img.s{width:64px}.santa-row img.r{width:54px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .snowfx{display:none}
}
</style>
</head>
<body>
<div id="flash"></div>

<section id="title" class="screen scene active">
  <div class="snowfx"></div>
  <div class="title-card">
    <p class="eyebrow">SANTA’S MATH TREE</p>
    <p class="school">하안중학교 3학년</p>
    <h1>산타의 크리스마스<br>트리 대작전</h1>
    <div class="duo">
      <img class="pix santa-big bob santaImg" alt="산타 할아버지">
      <img class="pix rudy-big bob2 rudyImg" alt="루돌프">
    </div>
    <p class="sub">삼각비, 원의 성질, 통계 문제를 풀고<br>오너먼트를 모아 하안중 트리를 완성해요</p>
    <div class="login">
      <label>학번<input id="inNo" inputmode="numeric" maxlength="6" placeholder="예: 30215" autocomplete="off"></label>
      <label>이름<input id="inName" maxlength="10" placeholder="예: 홍길동" autocomplete="off"></label>
      <p class="login-err" id="loginErr" role="alert"></p>
      <button class="btn big" id="startBtn">▶ 입장하기</button>
      <p class="login-note">입장하면 문제 풀이 기록과 게임 화면을 벗어난 기록이 선생님께 전달돼요.</p>
      <p class="login-note warn" id="modeNote"></p>
    </div>
    <button class="teacher-link" id="teacherLink">교사용 대시보드</button>

const track={
  ref:null,
  async login(no,name){
    if(!fdb) return null;
    this.ref=fdb.collection('students').doc(no+'_'+name);
    const snap=await this.ref.get();
    if(snap.exists){ await this.ref.update({lastSeen:TS(),status:'playing',awaySince:null,rejoins:INC(1)}); this.log('join'); return snap.data(); }
    await this.ref.set({no,name,joinedAt:TS(),lastSeen:TS(),status:'playing',awaySince:null,

  up(d){ if(this.ref) this.ref.update(d).catch(e=>console.warn('기록 실패',e)); },
  log(type,extra={}){
    if(!this.ref||!S.me) return;
    fdb.collection('events').add({sid:S.me.sid,no:S.me.no,name:S.me.name,type,at:TS(),...extra}).catch(()=>{});
  },
  viewing(q){ this.up({current:q.id,lastSeen:TS()}); },
  answer(q,ok,given,k){
    const L=LK[q.level], d={lastSeen:TS()};
    d[(ok?'correct.':'wrong.')+L]=INC(1);
    d['results.'+q.id]={ok,tries:S.tries[q.id],level:q.level,at:Date.now()};
    if(ok){ d.current=null; d.state=snapState(); }
    this.up(d);
    this.log(ok?'correct':'wrong',{q:q.id,level:q.level,given:given||'',tries:S.tries[q.id],reward:k||''});
  },
  save(){ this.up({state:snapState(),lastSeen:TS()}); },
  away(){ this.up({status:'away',awaySince:TS(),'away.count':INC(1)}); this.log('away'); },
  back(ms){ this.up({status:S.done?'done':'playing',awaySince:null,'away.totalMs':INC(ms),lastSeen:TS()}); this.log('back',{ms}); },
  finish(){ this.up({status:'done',finishedAt:TS(),state:snapState()}); this.log('finish'); },
  beat(){ this.up({lastSeen:TS()}); }
};

/* ---------------- 트리 캔버스 ---------------- */
const TW=120, TH=150;
const tiers=[[22,58,2,24],[44,88,8,36],[70,118,14,50]];
function inTree(x,y){
  for(const [t,b,a,w] of tiers){
    if(y>=t&&y<=b){ const hw=a+(w-a)*(y-t)/(b-t); if(Math.abs(x-60)<=hw) return true; }
  }
  return false;
}
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

const bg=document.createElement('canvas'); bg.width=TW; bg.height=TH;
(function(){
  const c=bg.getContext('2d'); const sky=['#0b1230','#121c42','#1a2856','#24356b','#2f4380'];
  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){
    const gy=138+Math.round(Math.sin(x/9)*1.5);
    if(y>=gy){ c.fillStyle=((x*7+y*3)%11===0)?'#cfd8f0':'#eef3ff'; }
    else{ let i=Math.floor(y/138*5+((x+y)%2?0.12:-0.12)); i=Math.max(0,Math.min(4,i)); c.fillStyle=sky[i]; }
    c.fillRect(x,y,1,1);
  }
  for(let y=-7;y<=7;y++)for(let x=-7;x<=7;x++){
    if(x*x+y*y<=42){ c.fillStyle=(x*x+(y+1)*(y+1)<=4||(x-3)*(x-3)+(y-2)*(y-2)<=1)?'#e6d48e':'#fff2b8'; c.fillRect(100+x,20+y,1,1); }
  }
})();
const starsPts=[]; for(let i=0;i<26;i++){ const x=Math.floor(rnd()*TW), y=Math.floor(rnd()*100); if(!inTree(x,y)&&!(Math.abs(x-100)<9&&Math.abs(y-20)<9)) starsPts.push([x,y]); }

const treeCv=document.createElement('canvas'); treeCv.width=TW; treeCv.height=TH;
(function(){
  const c=treeCv.getContext('2d');
  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){
    if(!inTree(x,y))continue;
    let col='#2f8f4e';
    let hw=0; for(const [t,b,a,w] of tiers) if(y>=t&&y<=b) hw=Math.max(hw,a+(w-a)*(y-t)/(b-t));
    if(x>60+hw*.35 && (x+y)%2===0) col='#24733e';
    if(x>60+hw*.7) col='#24733e';
    if(x<60-hw*.4 && (x+y)%3===0) col='#46b06a';
    if(!inTree(x+1,y)||!inTree(x-1,y)||!inTree(x,y-1)) col='#174d2a';
    if(!inTree(x,y+1)||(!inTree(x,y+2)&&(x%3))) col=(x%2)?'#ffffff':'#dfe7f5';
    c.fillStyle=col; c.fillRect(x,y,1,1);
  }
  for(let y=119;y<130;y++)for(let x=54;x<66;x++){ c.fillStyle=x>61?'#5a3519':'#7a4a26'; c.fillRect(x,y,1,1); }
  for(let y=128;y<146;y++){
    const l=Math.round(44+(y-128)*.3), r=Math.round(76-(y-128)*.3);
    for(let x=l;x<r;x++){
      let col='#c8372d'; if(x>r-6) col='#8e211a'; if(y===131||y===132) col='#f6c33b'; if(y===128) col='#8e211a';
      c.fillStyle=col; c.fillRect(x,y,1,1);
    }
  }
})();
const lights=[];
tiers.forEach(([t,b,a,w])=>{
  const yy=b-7; const hw=a+(w-a)*(yy-t)/(b-t);
  for(let x=60-hw+4;x<=60+hw-4;x+=5){ const y=Math.round(yy-4+Math.abs(x-60)/hw*4+Math.sin(x)*1); if(inTree(x,y)) lights.push([Math.round(x),y]); }
});
const LIGHTC=['#ff5a4e','#ffd84a','#6ee0ff','#ffffff','#9cff7a'];
const flakes=Array.from({length:36},()=>({x:rnd()*TW,y:rnd()*TH,s:.4+rnd()*.8,p:rnd()*6}));
const MOTEC=['#ffffff','#fff1a8','#ffd23b','#9ff3ff'];
let motes=[];
const OS=2; // 트리 위 오너먼트 확대 배율

function px(ctx,x,y,c,a=1){ ctx.globalAlpha=a; ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),1,1); ctx.globalAlpha=1; }
function plus(ctx,x,y,c,s=1){ x=Math.round(x); y=Math.round(y); px(ctx,x,y,c); for(let i=1;i<=s;i++){ px(ctx,x-i,y,c,.8); px(ctx,x+i,y,c,.8); px(ctx,x,y-i,c,.8); px(ctx,x,y+i,c,.8);} }
function halo(ctx,cx,cy,t,big){
  const r=(big?16:12)+Math.sin(t/3)*1.5, R=Math.ceil(r)+1;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    const d=Math.hypot(dx,dy);
    if(d<=r && d>r-2.5 && ((dx+dy+t)&1)===0) px(ctx,cx+dx,cy+dy,'#fff1a8',.55);
    else if(d<=r-2.5) px(ctx,cx+dx,cy+dy,'#fff3b0',.16);
  }
}
function legendFX(ctx,o,t,live){
  const cv=ORN[o.k].cv, big=!!ORN[o.k].top;
  halo(ctx,o.x,o.y,t,big);
  if(big){
    for(let k=0;k<8;k++){
      if((k+Math.floor(t/3))%2) continue;
      const a=k*Math.PI/4, L=5+((t+k)%5);
      for(let s=14;s<14+L+2;s++) px(ctx,o.x+Math.cos(a)*s,o.y+Math.sin(a)*s,'#fff3b0',.85*(1-(s-14)/(L+2)));
    }
  }
  return ()=>{
    const rr=(big?17:13);
    for(let k=0;k<2;k++){ const a=t/4+k*Math.PI+o.x; plus(ctx,o.x+Math.cos(a)*rr,o.y+Math.sin(a)*rr*.8,MOTEC[(k+t)%4],(t+k)%4<2?1:2); }
    if(live && Math.random()<.35) motes.push({x:o.x+(Math.random()-.5)*18,y:o.y+(Math.random()-.5)*12,vx:(Math.random()-.5)*.3,vy:-.25-Math.random()*.4,life:22,max:22});
  };
}
function burstAt(x,y,n=28){
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, sp=.8+Math.random()*1.4; motes.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:16,max:16}); }
}

const tree=document.getElementById('tree'); const tctx=tree.getContext('2d');
function drawTree(ctx, t, live=true){
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(bg,0,0);
  starsPts.forEach((p,i)=>{ if(!live||(t+i*3)%14<10){ ctx.fillStyle='#fff6c8'; ctx.fillRect(p[0],p[1],1,1);} });
  ctx.drawImage(treeCv,0,0);
  lights.forEach((p,i)=>{ ctx.fillStyle=LIGHTC[(i+Math.floor(t/4))%LIGHTC.length]; ctx.fillRect(p[0],p[1],1,1); });
  const after=[];
  S.placed.forEach(o=>{
    const def=ORN[o.k], cv=def.cv;
    if(def.legend) after.push(legendFX(ctx,o,t,live));
    ctx.drawImage(cv,Math.round(o.x-cv.width*OS/2),Math.round(o.y-cv.height*OS/2),cv.width*OS,cv.height*OS);
  });
  after.forEach(f=>f());
}
function render(){
  S.frame++;
  drawTree(tctx,S.frame);
  motes=motes.filter(m=>(m.life--)>0);
  motes.forEach((m,i)=>{ m.x+=m.vx; m.y+=m.vy; m.vx*=.94; m.vy=m.vy*.94-.02; px(tctx,m.x,m.y,MOTEC[(i+S.frame)%4],m.life/m.max); });
  if(S.sel>=0 && S.hover){
    const k=S.inv[S.sel], cv=ORN[k].cv; const p=ORN[k].top?{x:60,y:16}:S.hover;
    tctx.globalAlpha=.55; tctx.drawImage(cv,Math.round(p.x-cv.width*OS/2),Math.round(p.y-cv.height*OS/2),cv.width*OS,cv.height*OS); tctx.globalAlpha=1;
  }
  tctx.fillStyle='#ffffff';
  flakes.forEach(f=>{ f.y+=f.s; f.x+=Math.sin((S.frame+f.p*10)/10)*.25; if(f.y>TH){f.y=-2;f.x=Math.random()*TW;} tctx.fillRect(Math.round(f.x),Math.round(f.y),1,1); });
}

const eul=w=>{ const c=w.charCodeAt(w.length-1)-0xAC00; return w+((c>=0&&c%28)?'을':'를'); };

let actx;
function beep(notes){
  if(!S.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
    notes.forEach(([f,d])=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type='square'; o.frequency.value=f;
      g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d); t+=d; });
  }catch(e){}
}

function openQuestion(q){
  S.cur=q; track.viewing(q);
  if(q.level===3) say('상 상자는 제 코보다 더 반짝이는 장식이 들어 있어요. 힘내세요!','rudy');
  else say(pick(['천천히 생각해 보렴. 산타는 기다릴 수 있단다.','이 상자 안에는 뭐가 들어 있을까?','호호, 하안중 친구라면 풀 수 있을 거야!']));
  const body = q.type==='input'
    ? `<div class="ans"><input id="ansIn" autocomplete="off" inputmode="decimal" placeholder="답을 입력하세요" aria-label="답 입력"><button class="btn green" id="submitBtn">확인</button></div><p class="ans-note">${q.note||''}</p>`
    : `<div class="choices ${q.long?'long':''}">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${c}</span></button>`).join('')}</div>`;
  panel.innerHTML=`<div class="qhead"><span><span class="badge lv${q.level}">${LV[q.level].name} ${'★'.repeat(q.level)}</span><span class="src">${q.src}</span></span><button class="link" id="backBtn">다른 상자 고르기</button></div><div class="qtext">${q.q}</div>${body}`;
  $('backBtn').onclick=()=>{ say('다른 상자를 골라 보렴.'); renderPick(); };
  if(q.type==='input'){
    const inp=$('ansIn'); inp.focus();
    const go=()=>{ if(!inp.value.trim())return; const v=norm(inp.value); check(q.answer.some(a=>norm(a)===v), inp.value.trim()); };
    $('submitBtn').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
  }else{
    panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>check(+b.dataset.i===q.answer, (+b.dataset.i+1)+'번'));
  }
}
const norm=s=>String(s).replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/[°도점]/g,'').toLowerCase();

function reward(level){
  if(level===3 && !S.starGiven){ S.starGiven=true; return 'star'; }
  const pool=POOL[level].filter(k=>k!=='star');
  const fresh=pool.filter(k=>!S.inv.includes(k)&&!S.placed.some(o=>o.k===k));
  return pick(fresh.length?fresh:pool);
}

function check(ok,given=''){
  const q=S.cur; S.tries[q.id]=(S.tries[q.id]||0)+1;
  if(ok){
    S.solved.add(q.id); const k=reward(q.level); S.inv.push(k); S.sel=S.inv.length-1;
    track.answer(q,true,given,k);
    const legend=ORN[k].legend;
    move($('gameSanta'),'jump'); move($('gameRudy'),'jump'); updateHud(); renderInv();
    if(legend){
      beep(SFX.legend);
      const f=$('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
      say(pick(['우와아! 제 코보다 더 반짝여요! 눈이 부셔요!','세상에, 하안중 트리가 하늘에서도 보이겠어요!']),'rudy');
      const burst=Array.from({length:16},(_,i)=>`<i style="--a:${i*22.5}deg;--d:${80+(i%3)*20}px"></i>`).join('');
      panel.innerHTML=`<div class="result ok legend"><h3>✨ 대단해! 상 문제 정답 ✨</h3>
        <div class="reward-stage legend"><div class="rays"></div><div class="burst">${burst}</div><img class="pix reward-img" src="${ORN[k].url}" alt=""></div>
        <div class="reward-name">${eul(ORN[k].name)} 얻었어요</div><p class="rarity">상 상자에서만 나오는 반짝반짝 빛나는 오너먼트예요</p>
        <button class="btn" id="goTree">트리에 달러 가기</button></div>`;
    }else{
      beep(SFX.ok);
      say(pick(['호호호! 정말 잘했구나!','훌륭해! 산타 선물 목록에 이름을 적어 둬야겠구나!','정답이야! 하안중 3학년 실력이 대단하구나!']));
      panel.innerHTML=`<div class="result ok"><h3>정답!</h3><div class="reward-stage"><img class="pix reward-img" src="${ORN[k].url}" alt=""></div><div class="reward-name">${eul(ORN[k].name)} 얻었어요</div><button class="btn green" id="goTree">트리에 달러 가기</button></div>`;
    }
    $('goTree').onclick=()=>{
      renderPick();
      say(ORN[k].top?'황금 별은 트리 꼭대기 자리란다. 트리를 눌러 보렴!':'왼쪽 트리에서 마음에 드는 자리를 눌러 달아 주렴.');
      tree.focus();
    };
  }else{
    beep(SFX.no); move($('gameSanta'),'shake');
    track.answer(q,false,given);
    if(Math.random()<.5) say('괜찮아요! 저도 처음엔 썰매 끄는 게 엄청 어려웠어요. 힌트 보고 다시 해 봐요!','rudy');
    else say(pick(['앗, 아깝구나! 힌트를 줄게.','괜찮아, 산타도 가끔 굴뚝을 잘못 찾는단다.']));
    panel.innerHTML=`<div class="result no"><h3>아쉬워요!</h3><div class="hint">🎅 산타의 힌트: ${q.hint||'문제를 한 번 더 천천히 읽어 보렴.'}</div><div class="row"><button class="btn green" id="retry">다시 풀기</button><button class="btn ghost" id="other">다른 상자 고르기</button></div></div>`;
    $('retry').onclick=()=>openQuestion(q);
    $('other').onclick=()=>{ say('다른 상자를 골라 보렴.'); renderPick(); };
  }
}

function renderInv(){
  const box=$('inv');
  if(!S.inv.length){ box.innerHTML='<span class="empty">문제를 맞히면 여기에 오너먼트가 생겨요</span>'; tree.classList.remove('placing'); return; }
  box.innerHTML=S.inv.map((k,i)=>`<button class="inv-item ${i===S.sel?'sel':''} ${ORN[k].legend?'legend':''}" data-i="${i}" aria-label="${ORN[k].name}"><img class="pix" src="${ORN[k].url}" alt=""></button>`).join('');

}

function treePos(e){
  const r=tree.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*TW, y:(e.clientY-r.top)/r.height*TH};
}

});

/* ============== 화면 이탈 감지 ============== */
let awayStart=null, blurTimer=null, tracking=false;
function goAway(){ awayStart=Date.now(); track.away(); }
function evalFocus(){
  if(!S.me||$('dash').classList.contains('active')) return;
  const hidden=document.hidden, away=hidden||!document.hasFocus();
  if(away){
    if(awayStart) return;
    if(hidden){ if(blurTimer){clearTimeout(blurTimer);blurTimer=null;} goAway(); }
    else if(!blurTimer){ blurTimer=setTimeout(()=>{ blurTimer=null; if(!awayStart&&(document.hidden||!document.hasFocus())) goAway(); },1500); }
  }else{
    if(blurTimer){ clearTimeout(blurTimer); blurTimer=null; }
    if(awayStart){
      const ms=Date.now()-awayStart; awayStart=null; track.back(ms);
      if($('game').classList.contains('active')) say('어디 다녀왔니? 게임 화면을 벗어나면 선생님 화면에 표시된단다. ('+Math.max(1,Math.round(ms/1000))+'초)');
    }
  }
}
function startTracking(){
  if(tracking) return; tracking=true;
  document.addEventListener('visibilitychange',evalFocus);
  window.addEventListener('blur',evalFocus); window.addEventListener('focus',evalFocus);
  setInterval(()=>track.beat(),20000);
}

let dashRows=[], dashUnsub=null, dashFilter='all', knownAway=new Set(), dashReady=false, dashTick=null;
const LVK=['L','M','H'];
const CNT={L:0,M:0,H:0}; QUESTIONS.forEach(q=>CNT[LK[q.level]]++);
const ST={on:'게임 중',away:'화면 이탈',done:'완료',off:'연결 끊김'};
const tms=v=>v&&v.toMillis?v.toMillis():(typeof v==='number'?v:0);
const ms2txt=ms=>{ const s=Math.round(ms/1000); return s<60? s+'초' : Math.floor(s/60)+'분 '+(s%60)+'초'; };
const ago=ms=>{ if(!ms) return '-'; const s=Math.max(0,Math.round((Date.now()-ms)/1000)); return s<60? s+'초 전' : s<3600? Math.floor(s/60)+'분 전' : new Date(ms).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); };
function stOf(r){ if(r.status==='away') return 'away'; if(r.status==='done') return 'done'; return Date.now()-tms(r.lastSeen)>60000?'off':'on'; }
function awayMsOf(r){ let ms=(r.away&&r.away.totalMs)||0; if(r.status==='away'&&r.awaySince) ms+=Date.now()-tms(r.awaySince); return ms; }
const byNo=(a,b)=>String(a.no).localeCompare(String(b.no))||String(a.name).localeCompare(String(b.name));

function openDash(){
  show('dash'); renderDash();
  if(!fdb){
    $('liveTxt').textContent='파이어베이스 설정이 필요해요 (코드 위쪽 FB_CONFIG)';
    $('dashBody').innerHTML='<tr><td colspan="12" class="empty-row">파이어베이스를 연결하면 학생 기록이 여기에 실시간으로 표시돼요.</td></tr>';
    return;
  }
  if(dashUnsub) return;
  dashUnsub=fdb.collection('students').onSnapshot(s=>{
    dashRows=s.docs.map(d=>({id:d.id,...d.data()}));
    $('liveDot').classList.add('ok');
    $('liveTxt').textContent='실시간 연결됨 · 마지막 갱신 '+new Date().toLocaleTimeString('ko-KR');
    const nowAway=new Set(dashRows.filter(r=>r.status==='away').map(r=>r.id));
    const fresh=[...nowAway].filter(id=>!knownAway.has(id));
    if(fresh.length&&dashReady){
      const names=fresh.map(id=>{ const r=dashRows.find(x=>x.id===id); return r.no+' '+r.name; }).join(', ');
      toast('🔴 화면 이탈: '+names);
      if($('alertChk').checked){ const snd=S.sound; S.sound=true; beep([[880,.12],[660,.12],[880,.2]]); S.sound=snd; }
    }
    knownAway=nowAway; dashReady=true; renderDash();
  }, e=>{
    $('liveDot').classList.remove('ok');
    $('liveTxt').textContent='연결 오류: '+e.message+' (Firestore 보안 규칙을 확인하세요)';
  });
  dashTick=setInterval(renderDash,5000);
}

function renderDash(){
  const qq=$('dashSearch').value.trim();
  const c={all:dashRows.length,on:0,away:0,done:0,off:0};
  dashRows.forEach(r=>c[stOf(r)]++);
  $('kAll').textContent=c.all; $('kOn').textContent=c.on; $('kAway').textContent=c.away; $('kDone').textContent=c.done; $('kOff').textContent=c.off;
  document.querySelectorAll('.kpi').forEach(k=>k.classList.toggle('sel',k.dataset.f===dashFilter));
  $('filterTxt').textContent=dashFilter==='all'?'':'‘'+ST[dashFilter]+'’ 학생만 보는 중 · 숫자 칸을 다시 누르면 전체 보기';
  const list=dashRows.filter(r=>(dashFilter==='all'||stOf(r)===dashFilter)&&(!qq||String(r.no).includes(qq)||String(r.name).includes(qq))).sort(byNo);
  $('dashBody').innerHTML=list.map(r=>{
    const st=stOf(r), co=r.correct||{}, wr=r.wrong||{}, aw=r.away||{};
    const lv=LVK.map(k=>'<td><span class="lvc"><i><span style="width:'+((co[k]||0)/CNT[k]*100)+'%"></span></i>'+(co[k]||0)+'/'+CNT[k]+'</span></td>').join('');
    const tot=(co.L||0)+(co.M||0)+(co.H||0), wsum=(wr.L||0)+(wr.M||0)+(wr.H||0);
    const cq=r.current&&QMAP[r.current];
    const cur=st==='done'?'모두 완료':cq?LV[cq.level].name+' · '+cq.src:'-';
    const now=st==='away'&&r.awaySince?' '+ms2txt(Date.now()-tms(r.awaySince)):'';
    return '<tr class="'+st+'"><td>'+esc(r.no)+'</td><td>'+esc(r.name)+'</td><td><span class="chip '+st+'">'+ST[st]+now+'</span></td>'+lv+
      '<td><b>'+tot+'</b>/'+QUESTIONS.length+'</td><td>'+wsum+'회</td><td>'+(aw.count||0)+'회</td><td>'+ms2txt(awayMsOf(r))+'</td><td>'+esc(cur)+'</td><td>'+ago(tms(r.lastSeen))+'</td></tr>';
  }).join('') || '<tr><td colspan="12" class="empty-row">'+(dashRows.length?'조건에 맞는 학생이 없어요.':'아직 입장한 학생이 없어요. 학생이 학번과 이름을 입력하면 여기에 나타나요.')+'</td></tr>';
  $('qstats').innerHTML=QUESTIONS.map(q=>{
    let tried=0,ok=0,first=0;
    dashRows.forEach(r=>{ const x=(r.results||{})[q.id]; if(x){ tried++; if(x.ok){ ok++; if(x.tries===1) first++; } } });
    const p=tried?Math.round(ok/tried*100):0;
    return '<div class="qs"><div><span class="badge lv'+q.level+'">'+LV[q.level].name+'</span> '+q.src+'</div><div class="bar"><span style="width:'+p+'%"></span></div><div class="qs-n">'+
      (tried?'정답률 '+p+'% · 맞힘 '+ok+'/'+tried+'명 · 한 번에 맞힘 '+first+'명':'아직 푼 학생 없음')+'</div></div>';
  }).join('');
}
document.querySelectorAll('.kpi').forEach(k=>k.onclick=()=>{ dashFilter=(dashFilter===k.dataset.f)?'all':k.dataset.f; renderDash(); });
$('dashSearch').oninput=renderDash;
$('dashOut').onclick=()=>{ if(dashUnsub){dashUnsub();dashUnsub=null;} clearInterval(dashTick); dashReady=false; knownAway=new Set(); try{sessionStorage.removeItem('haanTeacher');}catch(e){} show('title'); };

/* 파일 저장 (엑셀에서 열리는 CSV) */
const csvCell=v=>{ v=v==null?'':String(v); return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
function downloadCSV(name,rows){
  const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
const stamp=()=>{ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); };
const fmt=ms=>ms?new Date(ms).toLocaleString('ko-KR'):'';
$('csvSum').onclick=()=>{
  if(!dashRows.length) return toast('저장할 기록이 아직 없어요.');
  const head=['학번','이름','상태','하 정답','중 정답','상 정답','총 정답','하 오답','중 오답','상 오답','총 오답','화면 이탈 횟수','화면 이탈 시간(초)','첫 입장','마지막 활동','완료 시각',
    ...QUESTIONS.map(q=>q.id+' ['+LV[q.level].name+'] '+q.src)];
  const rows=[...dashRows].sort(byNo).map(r=>{
    const co=r.correct||{}, wr=r.wrong||{};
    return [r.no,r.name,ST[stOf(r)],co.L||0,co.M||0,co.H||0,(co.L||0)+(co.M||0)+(co.H||0),wr.L||0,wr.M||0,wr.H||0,(wr.L||0)+(wr.M||0)+(wr.H||0),
      (r.away&&r.away.count)||0,Math.round(awayMsOf(r)/1000),fmt(tms(r.joinedAt)),fmt(tms(r.lastSeen)),fmt(tms(r.finishedAt)),
      ...QUESTIONS.map(q=>{ const x=(r.results||{})[q.id]; return !x?'':x.ok?'O ('+x.tries+'회 만에)':'X ('+x.tries+'회 시도)'; })];
  });
  downloadCSV('하안중_트리게임_요약_'+stamp()+'.csv',[head,...rows]);
};
$('csvLog').onclick=async()=>{
  if(!fdb) return toast('파이어베이스 연결 후 사용할 수 있어요.');

      return [fmt(tms(e.at)),e.no,e.name,T[e.type]||e.type,q?q.id+' '+q.src:'',q?LV[q.level].name:'',e.given||'',e.tries||'',e.reward&&ORN[e.reward]?ORN[e.reward].name:'',e.ms?Math.round(e.ms/1000):''];});
    downloadCSV('하안중_트리게임_상세_'+stamp()+'.csv',[['시각','학번','이름','구분','문항','난이도','제출한 답','시도 횟수','받은 오너먼트','이탈 시간(초)'],...rows]);
  }catch(e){ toast('불러오기 실패: '+e.message); }
};
$('resetAll').onclick=async()=>{
  if(!fdb) return;
  if(!confirm('모든 학생 기록과 상세 기록을 삭제할까요?\n삭제 전에 기록을 파일로 저장해 두세요.')) return;
  if(prompt('정말 삭제하려면 “삭제”라고 입력하세요.')!=='삭제') return;
  try{
    for(const col of ['students','events']){
      let s; do{ s=await fdb.collection(col).limit(400).get(); const b=fdb.batch(); s.docs.forEach(d=>b.delete(d.ref)); if(s.size) await b.commit(); }while(s.size);
    }
    knownAway=new Set(); toast('기록을 모두 삭제했어요.');
  }catch(e){ toast('삭제 실패: '+e.message); }
};
$('dialog').onclick=nextLine;
$('dialog').onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); nextLine(); } };
$('skipBtn').onclick=startGame;
$('soundBtn').onclick=()=>{ S.sound=!S.sound; $('soundBtn').textContent=S.sound?'🔊':'🔇'; };

setInterval(render,90);
if(location.hash==='#teacher') askPassword();
</script>
</body>
</html>
